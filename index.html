<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Surprise</title>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <section id="password-page">

        <div class="box">

            <h1>A Special Surprise</h1>

            <p>Enter the secret password</p>

            <input
                type="password"
                id="password-input"
                placeholder="Password"
            >

            <button onclick="checkPassword()">
                Unlock
            </button>

            <p id="error-message"></p>

        </div>

    </section>



    <section id="birthday-page">

        <div class="birthday-content">

            <img
                src="images/bouquet.png"
                class="bouquet"
            >

            <h1>
                Happy Birthday
                <span>Yesmine</span>
            </h1>

            <p>
                A special surprise made just for you
            </p>

        </div>

    </section>


    <script src="js/script.js"></script>

</body>

</html>
